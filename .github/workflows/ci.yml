name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: node scripts/build-frontend.mjs
      - run: python -m checkpoint demo
      - run: npm run smoke
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t checkpoint-lab .
      - name: Start nonroot image with bounded temporary storage
        run: docker run -d --name checkpoint --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --tmpfs /data:rw,nosuid,size=128m,uid=1000,gid=1000 --memory 256m --cpus 1 -p 3000:3000 checkpoint-lab
      - name: Wait for readiness and verify private durable intent
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/api/ready
          docker exec checkpoint node --input-type=module -e "const base='http://127.0.0.1:3000';const workspace=await(await fetch(base+'/api/workspaces',{method:'POST',headers:{'content-type':'application/json'},body:'{}'})).json();const response=await fetch(base+'/api/deliveries',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+workspace.token},body:JSON.stringify({destination:'https://example.org/webhook',reference:'container-smoke',payload:{smoke:true}})});const result=await response.json();if(!response.ok||result.delivery.state!=='queued'||result.delivery.attempts.length)throw Error('intent smoke failed');console.log('Private workspace and durable intent passed; no external POST sent');"
          docker exec checkpoint node -e "if(process.getuid()!==1000)process.exit(1)"
          test "$(docker inspect --format '{{.Config.User}}' checkpoint)" = node
      - name: Verify root-owned volume initialization and actual privilege drop
        run: |
          docker volume create checkpoint-product-data
          docker run --rm --user 0 -v checkpoint-product-data:/data --entrypoint node checkpoint-lab -e "const f=require('node:fs');f.chmodSync('/data',0o700);f.writeFileSync('/data/sibling','untouched',{mode:0o600});"
          docker run -d --name checkpoint-root --user 0 -e DROP_PRIVILEGES=1 -e DATA_DIR=/data/checkpoint -v checkpoint-product-data:/data --read-only --tmpfs /tmp:rw,nosuid,size=32m --memory 256m --cpus 1 -p 3001:3000 checkpoint-lab
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/api/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3001/api/ready
          docker exec checkpoint-root node -e "const f=require('node:fs');if((f.statSync('/data').mode&511)!==0o711)throw Error('parent traversal');const d=f.statSync('/data/checkpoint');if(d.uid!==1000||d.gid!==1000||(d.mode&511)!==0o700)throw Error('private owner');const s=f.statSync('/data/sibling');if(s.uid!==0||(s.mode&511)!==0o600)throw Error('recursive ownership mutation');"
          node --input-type=module -e "import {writeFile} from 'node:fs/promises';const base='http://127.0.0.1:3001';const ready=await(await fetch(base+'/api/ready')).json();if(ready.runtimeUid!==1000)throw Error('HTTP root');const w=await(await fetch(base+'/api/workspaces',{method:'POST',headers:{'content-type':'application/json'},body:'{}'})).json();const r=await(await fetch(base+'/api/deliveries',{method:'POST',headers:{authorization:'Bearer '+w.token,'content-type':'application/json'},body:JSON.stringify({destination:'https://example.org/webhook',reference:'persistent-container-intent',payload:{smoke:true}})})).json();if(r.delivery.state!=='queued')throw Error('intent missing');await writeFile('/tmp/checkpoint-private-test.json',JSON.stringify({token:w.token,id:r.delivery.id}),{mode:0o600});"
          docker kill --signal KILL checkpoint-root
          docker start checkpoint-root
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/api/ready; then break; fi
            sleep 1
          done
          node --input-type=module -e "import {readFile} from 'node:fs/promises';const v=JSON.parse(await readFile('/tmp/checkpoint-private-test.json','utf8'));const r=await fetch('http://127.0.0.1:3001/api/deliveries/'+v.id,{headers:{authorization:'Bearer '+v.token}});const b=await r.json();if(!r.ok||b.delivery.state!=='queued'||b.delivery.attempts.length)throw Error('durability after hard restart');console.log('Actual UID1000 HTTP and durable private intent survived container kill/restart');"
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs checkpoint || true
          docker logs checkpoint-root || true
          docker rm -f checkpoint checkpoint-root || true
          docker volume rm checkpoint-product-data || true
